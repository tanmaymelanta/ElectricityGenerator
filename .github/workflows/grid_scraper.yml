name: GRID India Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: daily_psp_2013_14
          path: daily_psp_2013_14.csv
